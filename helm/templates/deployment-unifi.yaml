apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unifi
  labels:
    app: unifi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unifi
  template:
    metadata:
      labels:
        app: unifi
    spec:
      containers:
      - name: unifi
        image: lscr.io/linuxserver/unifi-network-application:{{ .Values.unifi.image.tag }}
        env:
        - name: TZ
          value: Europe/Zurich
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: MONGO_HOST
          value: unifi-db
        - name: MONGO_PORT
          value: "27017"
        - name: MONGO_DBNAME
          value: unifi
        - name: MONGO_AUTHSOURCE
          value: admin
        - name: MONGO_USER
          value: unifi
        - name: MONGO_PASS
          valueFrom:
            secretKeyRef:
              name: unifi-db
              key: password
        # Java heap in MB
        - name: MEM_LIMIT
          value: "1024"
        - name: MEM_STARTUP
          value: "1024"
        ports:
        - containerPort: 8080
          name: unifi-http
          protocol: TCP
        - containerPort: 8443
          name: unifi-https
          protocol: TCP
        - containerPort: 3478
          name: unifi-udp
          protocol: UDP
        - containerPort: 10001
          name: unifi-discovery
          protocol: UDP
        resources:
          requests:
            memory: 1Gi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        hostPath:
          path: /home/he/unifi-network-application
          type: DirectoryOrCreate
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: floor
                operator: In
                values:
                - eg
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext: {}

---
apiVersion: v1
kind: Service
metadata:
  name: unifi-tcp
spec:
  type: NodePort
  selector:
    app: unifi
  ports:
  - name: unifi-http
    port: 8080
    targetPort: unifi-http
    nodePort: 30010
    protocol: TCP
  - name: unifi-https
    port: 8443
    targetPort: unifi-https
    nodePort: 30011
    protocol: TCP
  - name: unifi-udp
    port: 3478
    targetPort: unifi-udp
    nodePort: 30012
    protocol: UDP
  externalTrafficPolicy: Local