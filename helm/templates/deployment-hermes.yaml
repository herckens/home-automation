# Hermes Agent (https://github.com/NousResearch/hermes-agent)
#
# One-time setup on node EG:
#   1. mkdir -p /home/he/hermes
#      (the image starts as root, chowns /opt/data to the hermes user (UID 10000)
#      and then drops privileges, so no manual chown is needed)
#   2. After the first deploy, install the Home Assistant plugin (persists in /opt/data):
#        kubectl exec deploy/hermes -- hermes plugins install homeassistant
#        kubectl rollout restart deploy/hermes
#
# Model provider/base_url/default are (re)applied to config.yaml from values.yaml on
# every start by the init container; everything else in config.yaml is owned by Hermes.
# Dashboard (also used by Hermes Desktop -> Settings -> Gateways -> Remote gateway):
#   http://<EG-IP>:30013, username/password from the hermes Secret.
apiVersion: v1
kind: Secret
metadata:
  name: hermes
type: Opaque
stringData:
  apiKey: {{ required "hermes.apiKey is required" .Values.hermes.apiKey | quote }}
  telegramBotToken: {{ required "hermes.telegramBotToken is required" .Values.hermes.telegramBotToken | quote }}
  telegramAllowedUsers: {{ required "hermes.telegramAllowedUsers is required" .Values.hermes.telegramAllowedUsers | toString | quote }}
  hassToken: {{ required "hermes.hassToken is required" .Values.hermes.hassToken | quote }}
  dashboardUser: {{ required "hermes.dashboardUser is required" .Values.hermes.dashboardUser | quote }}
  dashboardPassword: {{ required "hermes.dashboardPassword is required" .Values.hermes.dashboardPassword | quote }}
  dashboardSecret: {{ required "hermes.dashboardSecret is required" .Values.hermes.dashboardSecret | quote }}
  copilotGithubToken: {{ required "hermes.copilotGithubToken is required" .Values.hermes.copilotGithubToken | quote }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  labels:
    app: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      automountServiceAccountToken: false
      initContainers:
      - name: configure-model
        image: nousresearch/hermes-agent:{{ .Values.hermes.image.tag }}
        args:
        - sh
        - -c
        - >-
          hermes config set model.provider custom &&
          hermes config set model.base_url "$MODEL_BASE_URL" &&
          hermes config set model.default "$MODEL_NAME"
        env:
        - name: MODEL_BASE_URL
          value: {{ .Values.hermes.baseUrl | quote }}
        - name: MODEL_NAME
          value: {{ .Values.hermes.model | quote }}
        volumeMounts:
        - name: hermes
          mountPath: /opt/data
      containers:
      - name: hermes
        image: nousresearch/hermes-agent:{{ .Values.hermes.image.tag }}
        args: ["gateway", "run"]
        env:
        - name: TZ
          value: Europe/Zurich
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        # The key is only sent to this exact origin, which must match model.base_url.
        - name: OPENAI_BASE_URL
          value: {{ .Values.hermes.baseUrl | quote }}
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes
              key: apiKey
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: hermes
              key: telegramBotToken
        - name: TELEGRAM_ALLOWED_USERS
          valueFrom:
            secretKeyRef:
              name: hermes
              key: telegramAllowedUsers
        # Home Assistant runs with hostNetwork on the same node.
        - name: HASS_URL
          value: http://$(HOST_IP):8123
        - name: HASS_TOKEN
          valueFrom:
            secretKeyRef:
              name: hermes
              key: hassToken
        - name: COPILOT_GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hermes
              key: copilotGithubToken
        - name: HERMES_DASHBOARD
          value: "1"
        - name: HERMES_DASHBOARD_HOST
          value: 0.0.0.0
        - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          valueFrom:
            secretKeyRef:
              name: hermes
              key: dashboardUser
        - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hermes
              key: dashboardPassword
        - name: HERMES_DASHBOARD_BASIC_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: hermes
              key: dashboardSecret
        - name: API_SERVER_ENABLED
          value: "false"
        ports:
        - containerPort: 9119
          name: dashboard
        resources:
          limits:
            memory: "1.5Gi"
          requests:
            memory: "1Gi"
        volumeMounts:
        - name: hermes
          mountPath: /opt/data
      volumes:
      - name: hermes
        hostPath:
          path: /home/he/hermes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: floor
                operator: In
                values:
                - eg
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: hermes-nodeport-service
spec:
  type: NodePort
  selector:
    app: hermes
  ports:
    - name: dashboard
      port: 9119
      targetPort: 9119
      nodePort: 30013
